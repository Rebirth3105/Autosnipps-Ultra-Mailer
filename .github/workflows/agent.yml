name: Autonomous Agent

on:
  push:
  pull_request:
  schedule:
    - cron: "0 */1 * * *"   # runs every 1 hour

jobs:
  run-agent:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.AGENTAPI }}
      AGENT_SERVER_URL: ${{ secrets.AGENT_SERVER_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger agent backend
        if: ${{ secrets.AGENT_SERVER_URL != '' }}
        run: |
          curl --fail --silent --show-error \
            -X POST "$AGENT_SERVER_URL/run" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d '{"repo":"${{ github.repository }}"}'

      - name: Skip agent backend if URL is not configured
        if: ${{ secrets.AGENT_SERVER_URL == '' }}
        run: echo "AGENT_SERVER_URL secret is not configured. Skipping agent trigger."